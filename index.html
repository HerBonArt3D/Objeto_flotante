<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realidad Aumentada - Uyuni</title>
    
    <!-- Librería de A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <!-- Librería MindAR para rastreo de imágenes -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>
    
    <!-- Iniciamos la escena de AR. 
         imageTargetSrc apunta a tu archivo .mind
         uiLoading="yes" muestra una pantalla de carga automática -->
    <a-scene 
        mindar-image="imageTargetSrc: marcador.mind;" 
        color-space="sRGB" 
        renderer="colorManagement: true, physicallyCorrectLights" 
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: false">
        
        <!-- Aquí cargamos tus archivos 3D a la memoria del teléfono -->
        <a-assets>
            <a-asset-item id="modelo3d" src="objeto.glb"></a-asset-item>
        </a-assets>

        <!-- La cámara principal del teléfono -->
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- ESTA ES EL ANCLA (targetIndex: 0 significa la imagen principal de tu .mind) -->
        <a-entity mindar-image-target="targetIndex: 0">
            
            <!-- Aquí colocamos el modelo 3D pegado al ancla -->
            <a-entity 
                gltf-model="#modelo3d" 
                scale="1 1 1" 
                position="0 0 0" 
                rotation="0 0 0">
            </a-entity>
            
        </a-entity>
        
    </a-scene>
</body>
</html>
